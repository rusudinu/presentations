version: 2
updates:
  - package-ecosystem: "pub"
    directories:
      - "/admd/examples"
      - "/mec/examples"
      - "/talks/he/demo"
      - "/talks/he/demo2"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "03:00"
      timezone: "Europe/Bucharest"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "dependabot"
      - "flutter"
    reviewers:
      - "rusudinu"

  - package-ecosystem: "gradle"
    directories:
      - "/admd/examples/android"
      - "/talks/he/demo/android"
      - "/talks/he/demo2/android"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "03:00"
      timezone: "Europe/Bucharest"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "dependabot"
      - "android"
    reviewers:
      - "rusudinu"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "03:00"
      timezone: "Europe/Bucharest"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "dependabot"
    reviewers:
      - "rusudinu"
