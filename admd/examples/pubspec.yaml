name: flutter_examples
description: "A new Flutter project."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  # HTTP libraries
  http: ^1.1.0              # Simple HTTP client with RetryClient support
  dio: ^5.11.1               # Feature-rich HTTP client with interceptors
  chopper: ^8.7.0           # Declarative REST API client
  retrofit: ^4.10.0          # Type-safe REST API client with annotations
  json_annotation: ^4.12.0   # JSON serialization annotations
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Code generation
  build_runner: ^2.16.1           # Build system for Dart code generation
  chopper_generator: ^8.7.0      # Code generator for Chopper
  retrofit_generator: ^10.2.11     # Code generator for Retrofit
  json_serializable: ^6.14.1      # JSON serialization code generator
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  freezed: ^4.0.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true   # gen-l10n: see l10n.yaml and lib/lecture14_polish/l10n
